<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citius AG · Property Survey (Prototype)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* ============================================================
     PROTOTIPO — "Property Survey" estilo cliente (inspirado en el
     deliverable interactivo de CBRE, pedido explícito del usuario).
     Standalone, con datos DUMMY (ver DUMMY_PROPERTIES abajo en el
     <script>) — de momento el foco es diseño + funcionalidad, no
     conectarlo a datos reales de Citius_Gestor_Registros.html.
     Reusa la MISMA paleta de marca que el sistema principal (--bg/
     --panel/--accent/etc.) para que se sienta parte de la misma
     familia de producto.
     ============================================================ */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#f0f1f4; --line:#e3e6eb;
    --txt:#1f2733; --muted:#6b7480; --accent:#f0b323; --accent-2:#d99a0e;
    --accent-ink:#3a2c05; --green:#1e9e5a; --red:#e2483d;
    --dark:#141a22; --dark-2:#1f2733; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,h5{margin:0;font-weight:600}
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer}

  /* ==== Topbar ==== */
  header.topbar{background:var(--dark);color:#fff;display:flex;align-items:center;gap:28px;
                padding:0 24px;height:64px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand img{height:34px;width:auto}
  nav.tabs{display:flex;align-items:center;gap:4px;flex:1;height:100%}
  nav.tabs button{background:none;border:none;color:rgba(255,255,255,.65);font-size:13.5px;font-weight:600;
                   padding:0 14px;height:100%;border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
  nav.tabs button:hover{color:#fff}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--accent)}
  .report-name{margin-left:6px;padding-left:20px;border-left:1px solid rgba(255,255,255,.18);
               color:rgba(255,255,255,.55);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
  .tb-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid rgba(255,255,255,.2);
          color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;transition:background .15s}
  .tb-btn:hover{background:rgba(255,255,255,.1)}
  .tb-btn svg{width:14px;height:14px}

  /* ==== Views ==== */
  .view{display:none}
  .view.active{display:block}
  .view-scroll{max-width:1400px;margin:0 auto;padding:32px 24px 80px}

  /* ==== Overview ==== */
  .cover{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 64px)}
  .cover-left{background:linear-gradient(165deg,var(--dark) 0%,#0d1116 100%);color:#fff;
              padding:64px;display:flex;flex-direction:column;justify-content:space-between}
  .cover-eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .cover-title{font-size:52px;font-weight:700;line-height:1.1;margin:18px 0 22px;font-family:Georgia,'Times New Roman',serif}
  .cover-rule{width:90px;height:3px;background:var(--accent);margin-bottom:22px}
  .cover-date{color:rgba(255,255,255,.65);font-size:14px}
  .cover-right{position:relative;background:#0d1116}
  .cover-right img{width:100%;height:100%;object-fit:cover;opacity:.92}
  .team-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:rgba(255,255,255,.04);
              border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);overflow:hidden}
  .team-card{padding:16px 18px;border-right:1px solid rgba(255,255,255,.1)}
  .team-card:last-child{border-right:none}
  .team-card .name{font-size:14px;font-weight:700}
  .team-card .role{color:rgba(255,255,255,.55);font-size:11.5px;margin:2px 0 8px}
  .team-card .mail{color:var(--accent);font-size:11px;display:flex;align-items:center;gap:5px;word-break:break-all}

  /* ==== Market Map ==== */
  .map-layout{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 64px)}
  #leafletMap{width:100%;height:100%}
  .map-side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .map-side-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .map-side-head h3{font-size:14px}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .switch{position:relative;width:36px;height:20px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:#d7dae0;border-radius:20px;transition:.15s;cursor:pointer}
  .switch .slider:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;
                          border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .switch input:checked + .slider{background:var(--green)}
  .switch input:checked + .slider:before{transform:translateX(16px)}
  .map-side-list{overflow-y:auto;flex:1;padding:10px}
  .prop-card{display:flex;gap:10px;padding:10px;border-radius:10px;transition:background .15s;cursor:pointer}
  .prop-card:hover{background:var(--panel-2)}
  .prop-thumb{width:78px;height:60px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden}
  .prop-pin-badge{position:absolute;top:4px;left:4px;background:var(--dark);color:#fff;font-size:10px;font-weight:700;
                   width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .prop-card-body{min-width:0;flex:1}
  .prop-card-body .pname{font-size:12.5px;font-weight:700;color:var(--dark-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prop-card-body .paddr{font-size:11px;color:var(--muted);margin:2px 0 6px;line-height:1.35;
                          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prop-card-actions{display:flex;gap:6px}

  /* Reusable "placeholder photo" — sin imágenes reales todavía (dummy data) */
  .ph-photo{background:linear-gradient(135deg,#e7e2d6 0%,#cfc4a8 45%,#9c8f6b 100%);position:relative}
  .ph-photo::after{content:"🏭";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
                    font-size:26px;opacity:.55;filter:grayscale(1) brightness(1.4)}
  .ph-photo.big::after{font-size:64px}

  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:11.5px;
       font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--txt);transition:.15s}
  .btn:hover{border-color:var(--muted)}
  .btn.short{padding:6px 8px}
  .btn-shortlist{border-color:var(--line)}
  .btn-shortlist svg{width:13px;height:13px}
  .btn-shortlist.active{background:var(--green);border-color:var(--green);color:#fff}
  .btn-shortlist.active svg{fill:#fff}
  .btn-comment{padding:6px 8px}
  .btn-comment svg{width:13px;height:13px}
  .btn-comment.has-comments{border-color:var(--accent);color:var(--accent-ink);background:rgba(240,179,35,.12)}

  /* ==== Comparison ==== */
  .compare-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .compare-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  table.compare{border-collapse:collapse;min-width:100%}
  table.compare th, table.compare td{padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
  table.compare thead th{position:sticky;top:0;background:var(--panel);z-index:2}
  table.compare .row-label{position:sticky;left:0;background:var(--panel-2);z-index:1;font-weight:700;
                            color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.3px;min-width:170px}
  table.compare thead th.row-label{z-index:3}
  .compare-col-head{width:220px;vertical-align:top;padding-top:14px}
  .compare-col-head .ph-photo{width:100%;height:110px;border-radius:8px;margin-bottom:8px}
  .compare-col-head .pname{font-size:13px;font-weight:700;color:var(--dark-2);margin-bottom:2px;cursor:pointer}
  .compare-col-head .pname:hover{color:var(--accent-2)}
  .compare-col-head .paddr{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px;min-height:30px}
  .compare-col-head .row-actions{display:flex;gap:6px;padding-bottom:14px}
  .pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
  .pill.classA{background:rgba(30,158,85,.15);color:#146b3c}
  .pill.classB{background:rgba(240,179,35,.18);color:var(--accent-ink)}
  .pill.existing{background:var(--panel-2);color:var(--muted)}
  .pill.construction{background:rgba(226,72,61,.12);color:#a5271e}

  /* ==== Property detail ==== */
  .detail-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--panel);
               border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:100}
  .detail-head .titles{min-width:0}
  .detail-head h2{font-size:19px;font-family:Georgia,'Times New Roman',serif;color:var(--dark-2)}
  .detail-head .addr{font-size:12.5px;color:var(--muted);margin-top:2px}
  .detail-nav{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .nav-circle{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
              display:flex;align-items:center;justify-content:center}
  .nav-circle:hover{border-color:var(--muted)}
  .nav-count{font-size:12px;color:var(--muted)}
  .detail-body{display:grid;grid-template-columns:1fr 1fr}
  .detail-photo{height:460px;position:relative}
  .detail-photo .ph-photo{position:absolute;inset:0}
  .detail-map{height:460px}
  .detail-info{max-width:1400px;margin:0 auto;padding:24px}
  .detail-info-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .detail-table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .detail-table tr:nth-child(even){background:var(--panel-2)}
  .detail-table td{padding:10px 16px;font-size:13px;border-bottom:1px solid var(--line)}
  .detail-table td:first-child{color:var(--muted);font-weight:600;width:220px}
  .detail-table tr:last-child td{border-bottom:none}

  /* Comments panel (mock) */
  .comments-panel{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:18px}
  .comments-panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:12px}
  .comment-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .comment-item:last-of-type{border-bottom:none}
  .comment-item .who{font-weight:700;color:var(--dark-2)}
  .comment-item .when{color:var(--muted);font-size:11px;margin-left:6px}
  .comment-form{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .comment-form input, .comment-form textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;
                                                font-size:12.5px;font-family:inherit;resize:vertical}
  .comment-form textarea{min-height:64px}
  .comment-form .btn{align-self:flex-end;background:var(--dark);color:#fff;border-color:var(--dark)}

  .section-title{font-size:20px;font-family:Georgia,'Times New Roman',serif;color:var(--dark-2);margin-bottom:4px}
  .section-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}

  /* Properties dropdown (topbar) */
  .dd-wrap{position:relative}
  .dd-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);
           border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:230px;padding:6px;z-index:300;display:none}
  .dd-menu.open{display:block}
  .dd-menu button{width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:7px;
                  font-size:12.5px;color:var(--txt);display:flex;align-items:center;gap:8px}
  .dd-menu button:hover{background:var(--panel-2)}
  .dd-num{width:18px;height:18px;border-radius:50%;background:var(--panel-2);color:var(--muted);font-size:10px;
          font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* Print — export "PDF" of shortlisted only (pedido explícito: función real de PDF puede venir después) */
  @media print{
    header.topbar, .compare-toolbar .btn, .btn-comment, .toggle-row{display:none !important}
    .view{display:none !important}
    #printSheet{display:block !important}
  }
  #printSheet{display:none}

  @media (max-width:980px){
    .cover{grid-template-columns:1fr}
    .cover-right{min-height:320px}
    .map-layout{grid-template-columns:1fr}
    .detail-body{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><img id="brandLogo" alt="Citius AG"></div>
  <nav class="tabs">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="map">Market Map</button>
    <button data-view="compare">Property Comparison</button>
    <div class="dd-wrap">
      <button id="propertiesDropdownBtn">Properties ▾</button>
      <div class="dd-menu" id="propertiesDropdown"></div>
    </div>
  </nav>
  <span class="report-name">Monterrey_Industrial Survey — Cliente Demo</span>
  <div class="topbar-right">
    <button class="tb-btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
      PDF
    </button>
  </div>
</header>

<!-- ================= OVERVIEW ================= -->
<section class="view active" id="view-overview">
  <div class="cover">
    <div class="cover-left">
      <div>
        <div class="cover-eyebrow">Industrial &middot; Monterrey Metro</div>
        <h1 class="cover-title">Property<br>Survey</h1>
        <div class="cover-rule"></div>
        <div class="cover-date" id="coverDate"></div>
      </div>
      <div class="team-strip" id="teamStrip"></div>
    </div>
    <div class="cover-right">
      <div class="ph-photo big" style="position:absolute;inset:0"></div>
    </div>
  </div>
</section>

<!-- ================= MARKET MAP ================= -->
<section class="view" id="view-map">
  <div class="map-layout">
    <div id="leafletMap"></div>
    <div class="map-side">
      <div class="map-side-head">
        <h3 id="mapListCount">Properties (0)</h3>
        <label class="toggle-row">Shortlisted
          <span class="switch"><input type="checkbox" id="mapShortlistToggle"><span class="slider"></span></span>
        </label>
      </div>
      <div class="map-side-list" id="mapSideList"></div>
    </div>
  </div>
</section>

<!-- ================= COMPARISON ================= -->
<section class="view" id="view-compare">
  <div class="view-scroll">
    <h2 class="section-title">Property Comparison</h2>
    <p class="section-sub">Side-by-side view of every shortlisted property, in the same format used for capture in the Citius Gestor system.</p>
    <div class="compare-toolbar">
      <label class="toggle-row">Shortlisted only
        <span class="switch"><input type="checkbox" id="compareShortlistToggle" checked><span class="slider"></span></span>
      </label>
      <button class="btn" onclick="window.print()">↓ Export PDF (shortlisted)</button>
    </div>
    <div class="compare-scroll"><table class="compare" id="compareTable"></table></div>
  </div>
</section>

<!-- ================= PROPERTY DETAIL ================= -->
<section class="view" id="view-detail">
  <div class="detail-head">
    <div class="titles">
      <h2 id="detailName"></h2>
      <div class="addr" id="detailAddr"></div>
    </div>
    <div class="detail-nav">
      <button class="nav-circle" id="detailPrev">←</button>
      <span class="nav-count" id="detailCount"></span>
      <button class="nav-circle" id="detailNext">→</button>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-photo"><div class="ph-photo big"></div></div>
    <div class="detail-map" id="detailMap"></div>
  </div>
  <div class="detail-info">
    <div class="detail-info-head">
      <h3 style="font-size:14px">Property Details</h3>
      <div class="row-actions" id="detailActions"></div>
    </div>
    <table class="detail-table" id="detailTable"></table>

    <div class="comments-panel">
      <h4>Comments</h4>
      <div id="detailComments"></div>
      <div class="comment-form">
        <input type="text" id="commentName" placeholder="Your name">
        <textarea id="commentText" placeholder="Enter comments here"></textarea>
        <button class="btn" id="commentSubmit">Submit</button>
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   clearHeightFt:36, clearHeightM:10.97, docks:24, driveIn:3, parking:140,
   construction:"Tilt Up", sprinklers:"ESFR", askingRate:6.8, askingUnit:"USD/SF/month",
   cam:0.30, camUnit:"USD/SF/month", owner:"Hines", developer:"Hines"},
];

/* -------- estado en memoria (persistido en localStorage, mismo criterio que el sistema
   principal para no perder la selección al recargar) -------- */
const LS_KEY = "citius_survey_prototype_v1";
function loadState(){ try{ const s=localStorage.getItem(LS_KEY); if(s) return JSON.parse(s); }catch(e){}
  return {shortlist:DUMMY_PROPERTIES.map(p=>p.id), comments:{}}; }
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();

let currentDetailId = DUMMY_PROPERTIES[0].id;
let leafletMapInst = null, leafletMarkers = {};
let detailMapInst = null;

const fmtNum = n => Math.round(n).toLocaleString("en-US");
const isShortlisted = id => state.shortlist.includes(id);
function toggleShortlist(id){
  if(isShortlisted(id)) state.shortlist = state.shortlist.filter(x=>x!==id);
  else state.shortlist.push(id);
  saveState();
  renderAll();
}
function propById(id){ return DUMMY_PROPERTIES.find(p=>p.id===id); }
function shortAddr(addr){ return addr.split(",").slice(0,2).join(","); }

function shortlistBtnHtml(id){
  const on = isShortlisted(id);
  return `<button type="button" class="btn btn-shortlist short${on?" active":""}" onclick="event.stopPropagation();toggleShortlist('${id}')" title="Shortlist">
    <svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    Shortlisted
  </button>`;
}
function commentBtnHtml(id){
  const n = (state.comments[id]||[]).length;
  return `<button type="button" class="btn btn-comment short${n?" has-comments":""}" onclick="event.stopPropagation();goToDetail('${id}')" title="Comments">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    ${n?n:""}
  </button>`;
}

/* ---------------- navegación entre vistas ---------------- */
function showView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+name).classList.add("active");
  document.querySelectorAll("nav.tabs > button[data-view]").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
  if(name==="map") setTimeout(()=>leafletMapInst && leafletMapInst.invalidateSize(), 50);
  if(name==="detail") setTimeout(()=>detailMapInst && detailMapInst.invalidateSize(), 50);
}
function goToDetail(id){ currentDetailId = id; renderDetail(); showView("detail"); }
document.querySelectorAll("nav.tabs > button[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));

/* ---------------- Properties dropdown ---------------- */
const ddBtn = document.getElementById("propertiesDropdownBtn");
const ddMenu = document.getElementById("propertiesDropdown");
ddBtn.onclick = (e)=>{ e.stopPropagation(); ddMenu.classList.toggle("open"); };
document.addEventListener("click", ()=>ddMenu.classList.remove("open"));
function renderDropdown(){
  ddMenu.innerHTML = DUMMY_PROPERTIES.map((p,i)=>
    `<button type="button" onclick="goToDetail('${p.id}')"><span class="dd-num">${i+1}</span>${p.name}</button>`).join("");
}

/* ---------------- Overview ---------------- */
document.getElementById("coverDate").textContent = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
document.getElementById("teamStrip").innerHTML = DUMMY_TEAM.map(t=>`
  <div class="team-card">
    <div class="name">${t.name}</div>
    <div class="role">${t.role}</div>
    <div class="mail">✉ ${t.mail}</div>
  </div>`).join("");

/* ---------------- Market Map ---------------- */
function initLeafletMap(){
  leafletMapInst = L.map("leafletMap", {zoomSnap:0.25, zoomDelta:0.25}).setView([25.75,-100.28], 10.4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:"&copy; OpenStreetMap contributors", maxZoom:19
  }).addTo(leafletMapInst);
  DUMMY_PROPERTIES.forEach((p,i)=>{
    const icon = L.divIcon({className:"", html:`<div style="background:#141a22;color:#fff;width:26px;height:26px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #f0b323;
      box-shadow:0 2px 6px rgba(0,0,0,.35)">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13]});
    const m = L.marker([p.lat,p.lng], {icon}).addTo(leafletMapInst);
    m.on("click", ()=>goToDetail(p.id));
    leafletMarkers[p.id]=m;
  });
}
function renderMapSidebar(){
  const onlyShortlisted = document.getElementById("mapShortlistToggle").checked;
  const list = onlyShortlisted ? DUMMY_PROPERTIES.filter(p=>isShortlisted(p.id)) : DUMMY_PROPERTIES;
  document.getElementById("mapListCount").textContent = `Properties (${list.length})`;
  document.getElementById("mapSideList").innerHTML = list.map(p=>{
    const idx = DUMMY_PROPERTIES.indexOf(p)+1;
    return `<div class="prop-card" onclick="goToDetail('${p.id}')">
      <div class="prop-thumb ph-photo"><span class="prop-pin-badge">${idx}</span></div>
      <div class="prop-card-body">
        <div class="pname">${p.name}</div>
        <div class="paddr">${shortAddr(p.address)}</div>
        <div class="prop-card-actions">${shortlistBtnHtml(p.id)}${commentBtnHtml(p.id)}</div>
      </div>
    </div>`;
  }).join("");
}
document.getElementById("mapShortlistToggle").onchange = renderMapSidebar;

/* ---------------- Comparison table ---------------- */
const COMPARE_ROWS = [
  {label:"Submarket", get:p=>p.submarket},
  {label:"Classification", get:p=>`<span class="pill ${p.classification==='A'?'classA':'classB'}">Class ${p.classification}</span>`},
  {label:"Status", get:p=>`<span class="pill ${p.status==='Ready'?'existing':'construction'}">${p.status}</span>`},
  {label:"Available SF", get:p=>fmtNum(p.availableSF)+" SF"},
  {label:"Min Divisible SF", get:p=>fmtNum(p.minDivisibleSF)+" SF"},
  {label:"Max Contiguous SF", get:p=>fmtNum(p.maxContiguousSF)+" SF"},
  {label:"Available Office SF", get:p=>fmtNum(p.officeSF)+" SF"},
  {label:"Clear Height", get:p=>`${p.clearHeightM.toFixed(2)} m — ${p.clearHeightFt.toFixed(1)} ft`},
  {label:"Docks", get:p=>p.docks},
  {label:"Drive-In Doors", get:p=>p.driveIn},
  {label:"Parking Spaces", get:p=>p.parking},
  {label:"Construction", get:p=>p.construction},
  {label:"Sprinklers", get:p=>p.sprinklers},
  {label:"Asking Rate", get:p=>`$${p.askingRate.toFixed(2)} (${p.askingUnit})`},
  {label:"CAM / NNN", get:p=>`$${p.cam.toFixed(2)} (${p.camUnit})`},
  {label:"Owner", get:p=>p.owner},
  {label:"Developer", get:p=>p.developer},
];
function renderCompareTable(){
  const onlyShortlisted = document.getElementById("compareShortlistToggle").checked;
  const list = onlyShortlisted ? DUMMY_PROPERTIES.filter(p=>isShortlisted(p.id)) : DUMMY_PROPERTIES;
  const table = document.getElementById("compareTable");
  if(!list.length){
    table.innerHTML = `<tr><td style="padding:40px;color:var(--muted)">No shortlisted properties yet — go to Market Map or Property Comparison and mark a few as Shortlisted.</td></tr>`;
    return;
  }
  let head = `<thead><tr><th class="row-label"></th>` + list.map(p=>{
    const idx = DUMMY_PROPERTIES.indexOf(p)+1;
    return `<th class="compare-col-head">
      <div class="ph-photo"><span class="prop-pin-badge">${idx}</span></div>
      <div class="pname" onclick="goToDetail('${p.id}')">${p.name}</div>
      <div class="paddr">${shortAddr(p.address)}</div>
      <div class="row-actions">${shortlistBtnHtml(p.id)}${commentBtnHtml(p.id)}</div>
    </th>`;
  }).join("") + `</tr></thead>`;
  let body = "<tbody>" + COMPARE_ROWS.map(r=>
    `<tr><td class="row-label">${r.label}</td>${list.map(p=>`<td>${r.get(p)}</td>`).join("")}</tr>`
  ).join("") + "</tbody>";
  table.innerHTML = head + body;
}
document.getElementById("compareShortlistToggle").onchange = renderCompareTable;

/* ---------------- Property detail ---------------- */
const DETAIL_ROWS = COMPARE_ROWS; // mismos campos, una sola columna
function renderDetail(){
  const p = propById(currentDetailId);
  const idx = DUMMY_PROPERTIES.indexOf(p);
  document.getElementById("detailName").textContent = p.name;
  document.getElementById("detailAddr").textContent = p.address;
  document.getElementById("detailCount").textContent = `${idx+1} of ${DUMMY_PROPERTIES.length}`;
  document.getElementById("detailActions").innerHTML = shortlistBtnHtml(p.id);
  document.getElementById("detailTable").innerHTML = DETAIL_ROWS.map(r=>
    `<tr><td>${r.label}</td><td>${r.get(p)}</td></tr>`).join("");
  renderDetailComments();

  if(!detailMapInst){
    detailMapInst = L.map("detailMap", {zoomControl:true}).setView([p.lat,p.lng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution:"&copy; OpenStreetMap contributors", maxZoom:19}).addTo(detailMapInst);
    detailMapInst.__marker = L.marker([p.lat,p.lng]).addTo(detailMapInst);
  } else {
    detailMapInst.setView([p.lat,p.lng], 15);
    detailMapInst.__marker.setLatLng([p.lat,p.lng]);
  }
}
document.getElementById("detailPrev").onclick = ()=>{
  const i = DUMMY_PROPERTIES.findIndex(p=>p.id===currentDetailId);
  currentDetailId = DUMMY_PROPERTIES[(i-1+DUMMY_PROPERTIES.length)%DUMMY_PROPERTIES.length].id;
  renderDetail();
};
document.getElementById("detailNext").onclick = ()=>{
  const i = DUMMY_PROPERTIES.findIndex(p=>p.id===currentDetailId);
  currentDetailId = DUMMY_PROPERTIES[(i+1)%DUMMY_PROPERTIES.length].id;
  renderDetail();
};

/* ---------------- Comments (mock, sin backend — solo localStorage) ---------------- */
function renderDetailComments(){
  const list = state.comments[currentDetailId]||[];
  const el = document.getElementById("detailComments");
  el.innerHTML = list.length ? list.map(c=>
    `<div class="comment-item"><span class="who">${escapeHtml(c.name)}</span><span class="when">${c.when}</span><div>${escapeHtml(c.text)}</div></div>`
  ).join("") : `<p style="color:var(--muted);font-size:12.5px">No comments yet.</p>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
document.getElementById("commentSubmit").onclick = ()=>{
  const name = document.getElementById("commentName").value.trim();
  const text = document.getElementById("commentText").value.trim();
  if(!name || !text) return;
  if(!state.comments[currentDetailId]) state.comments[currentDetailId]=[];
  state.comments[currentDetailId].push({name, text, when:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})});
  saveState();
  document.getElementById("commentName").value="";
  document.getElementById("commentText").value="";
  renderDetailComments();
  renderAll(); // refresca contadores de comentarios en Map/Comparison
};

/* ---------------- render orquestador ---------------- */
function renderAll(){
  renderDropdown();
  renderMapSidebar();
  renderCompareTable();
  if(document.getElementById("view-detail").classList.contains("active")) renderDetail();
}
